[package]
name = "fakes3"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
base64-simd = "0.8.0"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
crc-fast = "1.10"
form_urlencoded = "1.2.2"
futures = "0.3.34"
hex = "0.4.3"
http = "1"
hyper = "1"
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio", "server-graceful"] }
memmap2 = "0.9.12"
mimalloc = "0.1.52"
openssl-sys = { version = "0.9.117", features = ["vendored"] }
parking_lot = "0.13.0"
rustix = { version = "1.1.6", features = ["fs", "net", "process"] }
s3s = "0.17"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

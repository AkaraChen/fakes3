[package]
name = "fakes3"
version = "0.1.4"
edition = "2024"
description = "An in-memory S3 server for tests: millisecond startup, no persistence, AWS-compatible behaviour"
license = "MIT"
repository = "https://github.com/AkaraChen/fakes3"
readme = "README.md"
keywords = ["s3", "fake", "mock", "testing", "in-memory"]
categories = ["development-tools::testing", "web-programming::http-server"]
# The crate ships the library, the CLI, the examples and the tests; benchmarks, the SDK matrix and
# the Node binding stay in the repository.
include = ["/src", "/examples", "/tests", "/README.md", "/LICENSE"]

[dependencies]
async-trait = "0.1.92"
base64-simd = "0.8.0"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
crc-fast = "1.10"
form_urlencoded = "1.2.2"
futures = "0.3.34"
hex = "0.4.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio", "server-graceful"] }
mimalloc = "0.1.52"
openssl-sys = { version = "0.9.117", features = ["vendored"] }
parking_lot = "0.13.0"
percent-encoding = "2"
s3s = "0.17"
s3s-policy = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
time = "0.3"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }

# Platform specifics: large objects in memfds on Linux (src/spill.rs), the machine's memory size for
# the default memory limit elsewhere (src/memory.rs).
[target.'cfg(target_os = "linux")'.dependencies]
memmap2 = "0.9.12"
rustix = { version = "1.1.6", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[dev-dependencies]
aws-sdk-s3 = { version = "1.157.0", features = ["behavior-version-latest"] }
base64-simd = "0.8"
hmac = "0.13.0"
sha1 = "0.11"
sha2 = "0.11.1"

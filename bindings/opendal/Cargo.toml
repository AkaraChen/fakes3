[package]
name = "fakes3-opendal"
version = "0.1.1"
edition = "2024"
description = "OpenDAL operators backed by an in-process fakes3 server, for tests"
license = "MIT"
repository = "https://github.com/AkaraChen/fakes3"
readme = "README.md"
keywords = ["s3", "opendal", "fake", "testing", "in-memory"]
categories = ["development-tools::testing"]
include = ["/src", "/tests", "/README.md", "/LICENSE"]

# Not part of the root package's build: it has its own lockfile and target directory.
[workspace]

[dependencies]
fakes3 = { version = "0.1.2", path = "../.." }
form_urlencoded = "1"
opendal-core = "0.59.5"
opendal-service-s3 = "0.59.5"
# The server is plain HTTP on localhost, so no TLS backend.
opendal-http-transport-reqwest = { version = "0.59.5", default-features = false }

[dev-dependencies]
# As a typical user has it: default features (registry, reqwest transport) and the S3 service.
opendal = { version = "0.59.5", features = ["services-s3"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

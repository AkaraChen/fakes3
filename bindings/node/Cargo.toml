[package]
name = "fakes3-node"
version = "0.1.0"
edition = "2024"
publish = false

# Not part of the root package's build: the addon has its own lockfile and target directory.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4", default-features = false }
fakes3 = { path = "../.." }
http = "1"
napi = { version = "3.16.1", default-features = false, features = ["napi6", "async", "chrono_date"] }
napi-derive = "3.7.0"

[build-dependencies]
napi-build = "2.6.0"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

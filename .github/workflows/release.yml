name: release

# Builds the Alpine image for linux/amd64 and linux/arm64 (each on a native runner) and the static
# musl binaries from the same Dockerfile.
#
# Publishing only happens on an explicit trigger:
#   - pushing a `v*` tag: pushes ghcr.io/akarachen/fakes3 and attaches the binaries to a GitHub release
#   - manual dispatch with `publish: true`: pushes the image only (tagged with the commit sha)
# Anything else is a dry run: the images are built and smoke-tested, nothing leaves the runner.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the image to GHCR (dry run when false)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/akarachen/fakes3
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            triple: x86_64-unknown-linux-musl
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            triple: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$crate" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: fakes3:test
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

      - name: Smoke test
        run: |
          docker run --rm fakes3:test --version
          cid=$(docker run -d -p 9000:9000 fakes3:test)
          for _ in $(seq 100); do
            docker logs "$cid" 2>&1 | grep -q '^http://' && break
            sleep 0.1
          done
          docker logs "$cid"
          # Signatures are not verified by default, but an unsigned request is anonymous, and an
          # anonymous ListBuckets is AccessDenied (403), as on AWS.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/)
          docker rm -f "$cid" >/dev/null
          test "$code" = 403
          # The image has to stay a single static binary.
          docker create --name probe fakes3:test >/dev/null
          docker cp probe:/usr/local/bin/fakes3 /tmp/fakes3
          docker rm probe >/dev/null
          file /tmp/fakes3 | tee /dev/stderr | grep -Eq 'statically linked|static-pie linked'
          ls -l /tmp/fakes3

      - name: Export static binary
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: binary
          outputs: type=local,dest=out
          cache-from: type=gha,scope=image-${{ matrix.arch }}

      - name: Package binary
        run: |
          name=fakes3-${{ matrix.triple }}
          mkdir "$name"
          cp out/fakes3 README.md "$name"/
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" | tee "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.arch }}
          path: fakes3-${{ matrix.triple }}.tar.gz*
          if-no-files-found: error

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}

      - name: Export digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  # Joins the two per-architecture images into one multi-arch tag set.
  manifest:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      # v1.2.3 -> 1.2.3, 1.2, latest; always the short sha. Branch-less dispatch runs get the sha only.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          flavor: |
            latest=auto

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        working-directory: digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"

  # Attaches the static binaries to the GitHub release for the tag.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
          fi

name: ab

# Interleaved A/B performance comparison of two refs on one runner (bench/ab.py).
# Use this instead of comparing two separate bench runs: runners differ by up to 2x.
on:
  workflow_dispatch:
    inputs:
      base:
        description: "Ref for A (baseline)"
        default: "main"
      head:
        description: "Ref for B (candidate)"
        required: true
      rounds:
        description: "Interleaved rounds"
        default: "6"
      auth:
        description: "1: both verify signatures (--auth); 0: neither does (--no-auth on A, the default on B)"
        default: "1"
      workloads:
        description: "Comma-separated: small_get,small_get_c1,small_put,stat,list,versioned,large_get,large_get_c1,large_put"
        default: "small_get,small_get_c1,small_put,stat,list,versioned"
      runner:
        description: "Runner label: ubuntu-24.04, macos-15, windows-2025, ..."
        default: "ubuntu-24.04"

permissions:
  contents: read

jobs:
  ab:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: astral-sh/setup-uv@v10.3.3
      # The vendored OpenSSL build needs a native Windows Perl, not the MSYS one that comes with Git,
      # and NASM to build its assembly (MD5 included) rather than the plain C fallback.
      - if: runner.os == 'Windows'
        run: printf 'OPENSSL_SRC_PERL=%s\n' 'C:\Strawberry\perl\bin\perl.exe' >> "$GITHUB_ENV"
      - if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - name: Build A and B
        env:
          BASE: ${{ inputs.base }}
          HEAD_REF: ${{ inputs.head }}
        run: |
          tmp=$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")
          exe=$([ "$RUNNER_OS" = Windows ] && echo .exe || true)
          for side in a b; do
            ref=$([ "$side" = a ] && echo "$BASE" || echo "$HEAD_REF")
            git worktree add "$tmp/src-$side" "origin/$ref" 2>/dev/null || git worktree add "$tmp/src-$side" "$ref"
            (cd "$tmp/src-$side" && cargo build --release --locked)
            cp "$tmp/src-$side/target/release/fakes3$exe" "$tmp/fakes3-$side$exe"
            echo "$side = $ref @ $(git -C "$tmp/src-$side" rev-parse --short HEAD)"
          done
          bench/setup-native.sh warp
      - name: Compare
        env:
          ROUNDS: ${{ inputs.rounds }}
          WORKLOADS: ${{ inputs.workloads }}
          AUTH: ${{ inputs.auth }}
          BASE: ${{ inputs.base }}
          HEAD_REF: ${{ inputs.head }}
        run: |
          tmp=$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")
          exe=$([ "$RUNNER_OS" = Windows ] && echo .exe || true)
          echo "A = $BASE, B = $HEAD_REF" >> "$GITHUB_STEP_SUMMARY"
          uv run bench/ab.py "$tmp/fakes3-a$exe" "$tmp/fakes3-b$exe"

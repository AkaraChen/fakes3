name: python

# Builds the fakes3-sdk wheels (bindings/python): each one is the Python package plus the fakes3 binary
# for one platform, built the same way as the release binaries (static musl on Linux through the
# Dockerfile, cargo on macOS and Windows). Every wheel is installed and tested with pytest + boto3 on
# its own system, the Linux one also on Alpine.
#
# PyPI publishing only happens on a manual dispatch with `publish: true`, through PyPI trusted
# publishing (OIDC, no token) from the `pypi` environment; see bindings/python/PUBLISHING.md.
# Every other run checks the wheels with twine and uploads nothing.
on:
  push:
    branches: [main]
    paths: &paths
      - "bindings/python/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".github/workflows/python.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI (dry run when false)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The static musl binary runs on any Linux, so one wheel carries both tag families.
          - name: linux-x86_64
            runner: ubuntu-24.04
            docker: linux/amd64
            cache: amd64
            platform: manylinux_2_17_x86_64.manylinux2014_x86_64.musllinux_1_1_x86_64
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            docker: linux/arm64
            cache: arm64
            platform: manylinux_2_17_aarch64.manylinux2014_aarch64.musllinux_1_1_aarch64
          - name: macos-arm64
            runner: macos-15
            triple: aarch64-apple-darwin
            deployment-target: "11.0"
            platform: macosx_11_0_arm64
          - name: macos-x86_64
            runner: macos-15-intel
            triple: x86_64-apple-darwin
            deployment-target: "10.12"
            platform: macosx_10_12_x86_64
          - name: windows-x86_64
            runner: windows-2025
            triple: x86_64-pc-windows-msvc
            platform: win_amd64
    name: wheel (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4
        if: matrix.docker
      - name: Build the static binary
        if: matrix.docker
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.docker }}
          target: binary
          outputs: type=local,dest=out
          # The release workflow's cache, then this workflow's own.
          cache-from: |
            type=gha,scope=image-${{ matrix.cache }}
            type=gha,scope=python-${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=python-${{ matrix.cache }}
      - if: matrix.docker
        run: file out/fakes3 | tee /dev/stderr | grep -Eq 'statically linked|static-pie linked'

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.triple
        with:
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
        if: matrix.triple
        with:
          key: ${{ matrix.triple }}
      - uses: ./.github/actions/windows-openssl
      - name: Build the binary
        if: matrix.triple
        env:
          TRIPLE: ${{ matrix.triple }}
          DEPLOYMENT_TARGET: ${{ matrix.deployment-target }}
        run: |
          # As in the release: Windows links the C runtime statically.
          if [ "$RUNNER_OS" = Windows ]; then export RUSTFLAGS="-C target-feature=+crt-static"; fi
          # The oldest macOS the binary runs on, matching the wheel's tag.
          if [ -n "$DEPLOYMENT_TARGET" ]; then export MACOSX_DEPLOYMENT_TARGET="$DEPLOYMENT_TARGET"; fi
          cargo build --release --locked --target "$TRIPLE"
          exe=fakes3
          if [ "$RUNNER_OS" = Windows ]; then exe=fakes3.exe; fi
          mkdir out
          cp "target/$TRIPLE/release/$exe" out/

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build the wheel
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          exe=fakes3
          if [ "$RUNNER_OS" = Windows ]; then exe=fakes3.exe; fi
          python bindings/python/build_backend.py --platform "$PLATFORM" --out dist --binary "out/$exe"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  test:
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - { wheel: linux-x86_64, runner: ubuntu-24.04, python: "3.10" }
          - { wheel: linux-x86_64, runner: ubuntu-24.04, python: "3.13" }
          - { wheel: linux-aarch64, runner: ubuntu-24.04-arm, python: "3.13" }
          - { wheel: macos-arm64, runner: macos-15, python: "3.13" }
          - { wheel: macos-x86_64, runner: macos-15-intel, python: "3.13" }
          - { wheel: windows-x86_64, runner: windows-2025, python: "3.10" }
          - { wheel: windows-x86_64, runner: windows-2025, python: "3.13" }
    name: test (${{ matrix.wheel }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: wheel-${{ matrix.wheel }}
          path: dist

      # pip has to pick the wheel by its tags, as it would from PyPI.
      - name: Install the wheel
        run: |
          python -m pip install --no-index --find-links ../../dist fakes3-sdk
          python -m pip install pytest boto3
          python -c 'import fakes3; print(fakes3.__file__); print(fakes3.binary_path())'
          fakes3 --version

      # From the tests directory, so `fakes3` is the installed package, not the source tree.
      - name: pytest
        working-directory: bindings/python/tests
        run: python -m pytest -v -p no:cacheprovider

      - name: No server left running
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            if tasklist //FI "IMAGENAME eq fakes3.exe" | grep -i fakes3.exe; then exit 1; fi
          else
            if pgrep -l -x fakes3; then exit 1; fi
          fi

  # The Linux wheel on musl: pip on Alpine must accept it and the static binary must run there.
  alpine:
    needs: wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wheel-linux-x86_64
          path: dist
      - run: |
          docker run --rm -v "$PWD:/work" -w /work/bindings/python/tests python:3.13-alpine sh -euxc '
            pip install --root-user-action=ignore --no-index --find-links /work/dist fakes3-sdk
            pip install --root-user-action=ignore pytest boto3
            python -m pytest -v -p no:cacheprovider
          '

  # Runs on every build: the five wheels are there, named for the crate version, and pass twine's
  # checks. Nothing is uploaded.
  check:
    needs: [test, alpine]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: |
          ls -l dist
          test "$(find dist -name '*.whl' | wc -l)" = 5
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          for whl in dist/*.whl; do
            case "$(basename "$whl")" in
              "fakes3_sdk-$version-py3-none-"*) ;;
              *) echo "::error::$whl does not match version $version"; exit 1 ;;
            esac
          done
          python -m pip install twine
          python -m twine check --strict dist/*

  # Only a manual dispatch with `publish: true` gets here. Trusted publishing: the job trades its
  # OIDC token for a short-lived PyPI token, so the repository holds no secret. PyPI must list this
  # repository, `python.yml` and the `pypi` environment as a trusted publisher.
  publish:
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/fakes3-sdk
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
